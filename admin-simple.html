<!DOCTYPE html>
<html>
<head>
  <title>Admin Dashboard (Simple)</title>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body>
  <h1>Admin Dashboard – Simple View</h1>
  <div id="jobs"></div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBxeiG78oHv8wSLGRK_GAAD_mqvZKJtu30",
      authDomain: "jobpitality-1cfb2.firebaseapp.com",
      projectId: "jobpitality-1cfb2",
      storageBucket: "jobpitality-1cfb2.firebasestorage.app",
      messagingSenderId: "185191165097",
      appId: "1:185191165097:web:e0aeab622e8d89ef9a8db8"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();
    const jobsDiv = document.getElementById('jobs');

    // ---- Show a sign‑in pop‑up if not logged in ----
    auth.onAuthStateChanged(async function(user) {
      if (!user) {
        jobsDiv.innerHTML = `
          <p>🔐 Please sign in to view jobs.</p>
          <button onclick="signInPopup()" style="padding:12px 24px;font-size:16px;cursor:pointer;background:#C9A84C;border:none;border-radius:8px;font-weight:bold;">
            Sign in with Email
          </button>
          <p style="font-size:13px;color:#888;margin-top:12px;">Default admin: jobpitality@gmail.com</p>
        `;
        return;
      }

      // ---- Signed in – load jobs ----
      jobsDiv.innerHTML = '<p>⏳ Loading jobs…</p>';

      try {
        const snapshot = await db.collection('jobs').get();

        if (snapshot.empty) {
          jobsDiv.innerHTML = '<p>📭 No jobs found in Firestore.</p>';
          return;
        }

        let html = `<h2>📋 All Jobs (${snapshot.size})</h2>`;
        snapshot.forEach(doc => {
          const job = doc.data();
          const status = job.status || 'pending';
          const posted = job.postedDate?.toDate?.() 
            ? new Date(job.postedDate.toDate()).toLocaleDateString() 
            : 'Unknown';

          html += `
            <div style="border:1px solid #ccc;padding:15px;margin:10px 0;border-radius:8px;">
              <h3>${job.jobTitle || 'Untitled'}</h3>
              <p><strong>Company:</strong> ${job.companyName || 'N/A'}</p>
              <p><strong>Status:</strong> <span style="font-weight:bold;color:${status === 'pending' ? '#E63946' : '#2A9D8F'}">${status}</span></p>
              <p><strong>Posted:</strong> ${posted}</p>
              <p><strong>Description:</strong> ${job.jobDescription ? job.jobDescription.substring(0, 120) + '…' : 'N/A'}</p>
              ${status === 'pending' ? `
                <button onclick="updateStatus('${doc.id}', 'approved')" style="background:#2A9D8F;color:white;border:none;padding:8px 16px;border-radius:6px;cursor:pointer;">✅ Approve</button>
                <button onclick="updateStatus('${doc.id}', 'rejected')" style="background:#E63946;color:white;border:none;padding:8px 16px;border-radius:6px;cursor:pointer;">❌ Reject</button>
              ` : `
                <span>✅ Already ${status}</span>
              `}
            </div>
          `;
        });
        jobsDiv.innerHTML = html;

      } catch (error) {
        console.error('Error loading jobs:', error);
        jobsDiv.innerHTML = `<p>❌ Error loading jobs: ${error.message}</p>`;
      }
    });

    // ---- Sign‑in function (pop‑up) ----
    window.signInPopup = function() {
      const email = prompt('Enter your email:');
      if (!email) return;
      const password = prompt('Enter your password:');
      if (!password) return;

      auth.signInWithEmailAndPassword(email, password)
        .then(() => {
          alert('✅ Signed in successfully!');
          location.reload();
        })
        .catch(error => {
          alert('❌ Error signing in: ' + error.message);
        });
    };

    // ---- Update job status ----
    window.updateStatus = async function(jobId, newStatus) {
      try {
        await db.collection('jobs').doc(jobId).update({
          status: newStatus,
          approvedDate: firebase.firestore.FieldValue.serverTimestamp()
        });
        alert('✅ Job ' + newStatus + ' successfully!');
        location.reload();
      } catch (error) {
        alert('❌ Error: ' + error.message);
      }
    };
  </script>
</body>
</html>
