<!doctype html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Employer Registration | HospitalityRecruit</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet" />
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family:'Inter',sans-serif;
      background:linear-gradient(135deg, #0A1628 0%, #0F2844 100%);
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:1.5rem;
    }
    .register-card {
      background:#fff;
      border-radius:16px;
      padding:2.5rem 2rem;
      max-width:500px;
      width:100%;
      box-shadow:0 25px 50px -12px rgba(0,0,0,0.25);
      border-top:4px solid #C9A84C;
    }
    .register-header { text-align:center; margin-bottom:2rem; }
    .register-header .brand { font-family:'Playfair Display',serif; font-size:1.8rem; font-weight:800; color:#0A1628; text-decoration:none; }
    .register-header .brand .gold { color:#C9A84C; }
    .register-header h1 { font-size:1.5rem; color:#0A1628; margin-top:0.5rem; }
    .register-header p { color:#8A8580; font-size:0.95rem; }
    .form-group { margin-bottom:1.25rem; }
    .form-group label { display:block; font-weight:600; font-size:0.9rem; margin-bottom:0.4rem; color:#0A1628; }
    .form-group input, .form-group select {
      width:100%; padding:0.85rem 1rem;
      border:2px solid #E8E5DF; border-radius:8px;
      font-size:1rem; transition:border-color 0.2s;
    }
    .form-group input:focus, .form-group select:focus { outline:none; border-color:#C9A84C; }
    .form-row { display:grid; grid-template-columns:1fr; gap:1rem; }
    @media (min-width:480px) { .form-row { grid-template-columns:1fr 1fr; } }
    .btn {
      display:inline-flex; align-items:center; justify-content:center; gap:0.5rem;
      width:100%; padding:0.85rem 1.5rem;
      background:#C9A84C; color:#0A1628;
      border:none; border-radius:50px;
      font-weight:700; font-size:1rem;
      cursor:pointer; transition:all 0.2s;
    }
    .btn:hover { background:#E8C84A; transform:translateY(-2px); }
    .btn:disabled { opacity:0.6; cursor:not-allowed; transform:none; }
    .form-error {
      display:none; text-align:center; padding:0.75rem 1rem;
      background:rgba(230,57,70,0.08); border-radius:8px;
      border:1px solid #E63946; color:#E63946;
      margin-bottom:1rem; font-size:0.9rem;
    }
    .form-success {
      display:none; text-align:center; padding:1.5rem;
      background:rgba(42,157,143,0.08); border-radius:8px;
      border:1px solid #2A9D8F; color:#2A9D8F;
      margin-bottom:1rem;
    }
    .form-success .icon { font-size:3rem; color:#2A9D8F; margin-bottom:0.5rem; }
    .form-success h3 { font-family:'Playfair Display',serif; color:#2A9D8F; font-size:1.2rem; margin-bottom:0.25rem; }
    .form-success p { color:#8A8580; font-size:0.95rem; }
    .divider { display:flex; align-items:center; gap:1rem; margin:1.5rem 0; color:#8A8580; font-size:0.85rem; }
    .divider::before, .divider::after { content:''; flex:1; height:1px; background:#E8E5DF; }
    .register-footer { text-align:center; margin-top:1.5rem; padding-top:1.5rem; border-top:1px solid #E8E5DF; }
    .register-footer p { color:#8A8580; font-size:0.9rem; }
    .register-footer a { color:#C9A84C; text-decoration:none; font-weight:600; }
    .register-footer a:hover { text-decoration:underline; }
  </style>
</head>
<body>
  <div class="register-card">
    <div class="register-header">
      <a href="/" class="brand">Hospitality<span class="gold">Recruit</span></a>
      <h1>Create Employer Account</h1>
      <p>Join HospitalityRecruit and start posting jobs today</p>
    </div>
    <div class="form-error" id="formError"><i class="fas fa-exclamation-circle"></i> <span id="errorMessage">Please correct the errors below.</span></div>
    <div class="form-success" id="formSuccess"><div class="icon"><i class="fas fa-check-circle"></i></div><h3>Account Created!</h3><p>Your employer account has been created successfully. Redirecting...</p></div>
    <form id="registerForm">
      <div class="form-row">
        <div class="form-group"><label>Company Name <span style="color:#E63946;">*</span></label><input type="text" id="companyName" placeholder="e.g. 4T Luxury Hotel" required /></div>
        <div class="form-group"><label>Industry <span style="color:#E63946;">*</span></label>
          <select id="industry" required><option value="">Select</option><option value="hotel">Hotel &amp; Resort</option><option value="restaurant">Restaurant</option><option value="catering">Events &amp; Catering</option><option value="travel">Travel &amp; Tourism</option><option value="culinary">Culinary</option><option value="other">Other</option></select>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>Contact Person <span style="color:#E63946;">*</span></label><input type="text" id="contactName" placeholder="e.g. John Doe" required /></div>
        <div class="form-group"><label>Phone Number <span style="color:#E63946;">*</span></label><input type="tel" id="contactPhone" placeholder="+234 800 000 0000" required /></div>
      </div>
      <div class="form-group"><label>Email Address <span style="color:#E63946;">*</span></label><input type="email" id="email" placeholder="you@company.com" required /></div>
      <div class="form-group"><label>Password <span style="color:#E63946;">*</span></label><input type="password" id="password" placeholder="Min 6 characters" minlength="6" required /></div>
      <div class="form-group"><label>Confirm Password <span style="color:#E63946;">*</span></label><input type="password" id="confirmPassword" placeholder="Re-enter your password" required /></div>
      <button type="submit" class="btn" id="registerBtn"><i class="fas fa-user-plus"></i> Create Account</button>
    </form>
    <div class="divider">or</div>
    <div class="register-footer"><p>Already have an account? <a href="/employers/login/">Sign in here</a></p></div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const firebaseConfig = {
        apiKey: "AIzaSyBxeiG78oHv8wSLGRK_GAAD_mqvZKJtu30",
        authDomain: "jobpitality-1cfb2.firebaseapp.com",
        projectId: "jobpitality-1cfb2",
        storageBucket: "jobpitality-1cfb2.firebasestorage.app",
        messagingSenderId: "185191165097",
        appId: "1:185191165097:web:e0aeab622e8d89ef9a8db8"
      };

      let auth = null, db = null;
      try {
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        auth = firebase.auth();
        db = firebase.firestore();
      } catch (e) { console.warn('Firebase init error:', e); }

      const form = document.getElementById('registerForm');
      const registerBtn = document.getElementById('registerBtn');
      const formError = document.getElementById('formError');
      const errorMessage = document.getElementById('errorMessage');
      const formSuccess = document.getElementById('formSuccess');

      if (auth) {
        auth.onAuthStateChanged(function(user) {
          if (user) window.location.href = '/employers/dashboard/';
        });
      }

      if (form) {
        form.addEventListener('submit', async function(e) {
          e.preventDefault();
          formError.style.display = 'none';
          formSuccess.style.display = 'none';

          const data = {
            companyName: document.getElementById('companyName').value.trim(),
            industry: document.getElementById('industry').value,
            contactName: document.getElementById('contactName').value.trim(),
            contactPhone: document.getElementById('contactPhone').value.trim(),
            email: document.getElementById('email').value.trim(),
            password: document.getElementById('password').value,
            confirmPassword: document.getElementById('confirmPassword').value
          };

          if (!data.companyName || !data.industry || !data.contactName || !data.contactPhone || !data.email || !data.password || !data.confirmPassword) {
            showError('Please fill in all required fields.');
            return;
          }
          if (data.password.length < 6) { showError('Password must be at least 6 characters.'); return; }
          if (data.password !== data.confirmPassword) { showError('Passwords do not match.'); return; }

          registerBtn.disabled = true;
          registerBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Creating account...';

          try {
            if (!auth || !db) throw new Error('Firebase not available');
            const userCredential = await auth.createUserWithEmailAndPassword(data.email, data.password);
            await userCredential.user.updateProfile({ displayName: data.companyName });
            await db.collection('employers').doc(userCredential.user.uid).set({
              companyName: data.companyName,
              industry: data.industry,
              contactName: data.contactName,
              contactPhone: data.contactPhone,
              contactEmail: data.email,
              createdAt: firebase.firestore.FieldValue.serverTimestamp(),
              uid: userCredential.user.uid
            });
            formSuccess.style.display = 'block';
            form.style.display = 'none';
            setTimeout(function() { window.location.href = '/employers/dashboard/'; }, 2000);
          } catch (error) {
            let msg = 'Registration failed.';
            if (error.code === 'auth/email-already-in-use') msg = 'This email is already registered. Please sign in.';
            else if (error.code === 'auth/weak-password') msg = 'Password is too weak.';
            showError(msg);
          }
          registerBtn.disabled = false;
          registerBtn.innerHTML = '<i class="fas fa-user-plus"></i> Create Account';
        });
      }

      function showError(msg) {
        errorMessage.textContent = msg;
        formError.style.display = 'block';
        setTimeout(function() { formError.style.display = 'none'; }, 5000);
      }
    });
  </script>
</body>
</html>
