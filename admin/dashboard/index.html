<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
  <title>Admin Dashboard | HospitalityRecruit</title>
  <meta name="description" content="Super Admin panel to review and approve job postings." />

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Playfair+Display:ital,wght@0,400;0,700;0,800;0,900;1,400;1,700&display=swap" rel="stylesheet" />

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <style>
    /* ===== RESET & VARIABLES ===== */
    * { margin:0; padding:0; box-sizing:border-box; }
    :root {
      --color-primary: #0A1628;
      --color-primary-dark: #050A14;
      --color-gold: #C9A84C;
      --color-gold-light: #E8C84A;
      --color-gold-dark: #A8873A;
      --color-white: #FFFFFF;
      --color-charcoal: #2D2D2D;
      --color-gray-soft: #F4F2EE;
      --color-gray-200: #E8E5DF;
      --color-gray-300: #D5D0C8;
      --color-gray-600: #8A8580;
      --color-gray-700: #5A5550;
      --color-success: #2A9D8F;
      --color-emergency: #E63946;
      --font-serif: 'Playfair Display', Georgia, serif;
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      --shadow-sm: 0 1px 3px 0 rgba(0,0,0,0.08);
      --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.1);
      --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.1);
      --shadow-xl: 0 20px 25px -5px rgba(0,0,0,0.15);
      --shadow-2xl: 0 25px 50px -12px rgba(0,0,0,0.25);
      --transition-fast: 150ms cubic-bezier(0.4,0,0.2,1);
      --transition-normal: 250ms cubic-bezier(0.4,0,0.2,1);
      --radius-lg: 12px;
      --radius-md: 8px;
    }
    body {
      font-family:var(--font-sans);
      font-weight:400;
      line-height:1.6;
      color:var(--color-charcoal);
      background:var(--color-gray-soft);
      min-height:100vh;
    }
    .container { max-width:1280px; margin:0 auto; padding:0 16px; }
    @media (min-width:640px) { .container { padding:0 24px; } }
    h1, h2, h3 { font-family:var(--font-serif); font-weight:800; line-height:1.2; color:var(--color-primary); letter-spacing:-0.02em; }
    h2 { font-size:1.8rem; margin-bottom:0.5rem; }
    .text-gold { color:var(--color-gold); }

    /* ===== BUTTONS ===== */
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem;
      padding: 0.6rem 1.25rem; font-weight: 700; font-size: 0.85rem;
      border-radius: 50px; transition: all var(--transition-normal);
      cursor: pointer; border: none; font-family: var(--font-sans);
      min-height: 40px; text-decoration: none;
    }
    .btn-gold { background:var(--color-gold); color:var(--color-primary); }
    .btn-gold:hover { background:var(--color-gold-light); transform:translateY(-2px); box-shadow:var(--shadow-md); }
    .btn-success { background:var(--color-success); color:var(--color-white); }
    .btn-success:hover { background:#21867a; transform:translateY(-2px); box-shadow:var(--shadow-md); }
    .btn-danger { background:var(--color-emergency); color:var(--color-white); }
    .btn-danger:hover { background:#c1121f; transform:translateY(-2px); box-shadow:var(--shadow-md); }
    .btn-outline-gold { background:transparent; color:var(--color-gold); border:2px solid var(--color-gold); }
    .btn-outline-gold:hover { background:var(--color-gold); color:var(--color-primary); transform:translateY(-2px); }
    .btn-sm { padding:0.4rem 1rem; font-size:0.8rem; min-height:34px; }
    .btn-block { width:100%; }

    /* ===== HEADER ===== */
    .site-header {
      background:var(--color-primary);
      box-shadow:var(--shadow-md);
      position:sticky; top:0; z-index:1000; padding:0.75rem 0;
      border-bottom:3px solid var(--color-gold);
    }
    .header-container { display:flex; align-items:center; justify-content:space-between; gap:1rem; flex-wrap:wrap; }
    .logo .brand-name { font-family:var(--font-serif); font-size:1.6rem; font-weight:800; color:var(--color-white); letter-spacing:-0.5px; text-decoration:none; }
    .logo .brand-name .gold { color:var(--color-gold); }
    .logo-tagline { font-size:0.65rem; color:rgba(255,255,255,0.5); text-transform:uppercase; letter-spacing:2px; font-weight:600; margin-top:-2px; }
    .header-actions { display:flex; align-items:center; gap:1rem; flex-wrap:wrap; }
    .header-actions .user-badge { display:flex; align-items:center; gap:0.5rem; padding:0.4rem 1rem; background:rgba(255,255,255,0.1); border-radius:50px; color:var(--color-white); font-weight:600; font-size:0.85rem; }
    .header-actions .user-badge i { color:var(--color-gold); }

    /* ===== STATS ===== */
    .stats-grid {
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:1rem;
      margin:2rem 0;
    }
    @media (min-width:640px) { .stats-grid { grid-template-columns:repeat(4,1fr); } }
    .stat-card {
      background:var(--color-white);
      border-radius:var(--radius-md);
      padding:1.25rem 1rem;
      text-align:center;
      border:1px solid var(--color-gray-200);
      box-shadow:var(--shadow-sm);
    }
    .stat-card .stat-number { font-size:2rem; font-weight:900; color:var(--color-primary); display:block; line-height:1; }
    .stat-card .stat-label { font-size:0.8rem; color:var(--color-gray-600); font-weight:600; text-transform:uppercase; letter-spacing:0.5px; margin-top:0.25rem; }

    /* ===== TAB FILTERS ===== */
    .tab-filters {
      display:flex;
      gap:0.5rem;
      margin:1.5rem 0;
      flex-wrap:wrap;
    }
    .tab-btn {
      padding:0.5rem 1.25rem;
      border:2px solid var(--color-gray-200);
      border-radius:50px;
      background:var(--color-white);
      font-weight:600;
      font-size:0.85rem;
      color:var(--color-gray-700);
      cursor:pointer;
      transition:all var(--transition-fast);
    }
    .tab-btn:hover { border-color:var(--color-gold); color:var(--color-gold); }
    .tab-btn.active { background:var(--color-gold); border-color:var(--color-gold); color:var(--color-primary); }

    /* ===== JOB LIST ===== */
    .job-list {
      display:grid;
      grid-template-columns:1fr;
      gap:1.5rem;
      margin-top:1.5rem;
    }
    .job-card {
      background:var(--color-white);
      border-radius:var(--radius-lg);
      padding:1.5rem;
      border:1px solid var(--color-gray-200);
      box-shadow:var(--shadow-sm);
      transition:all var(--transition-normal);
    }
    .job-card:hover { box-shadow:var(--shadow-md); border-color:var(--color-gold); }
    .job-card .job-header {
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      flex-wrap:wrap;
      gap:0.5rem;
      margin-bottom:0.75rem;
    }
    .job-card .job-title {
      font-family:var(--font-serif);
      font-size:1.15rem;
      font-weight:800;
      color:var(--color-primary);
    }
    .job-card .job-company { font-weight:600; color:var(--color-gray-700); font-size:0.95rem; }
    .job-card .job-company i { color:var(--color-gold); width:18px; }
    .job-card .job-meta {
      display:flex;
      flex-wrap:wrap;
      gap:0.75rem 1.5rem;
      margin:0.5rem 0;
      font-size:0.85rem;
      color:var(--color-gray-600);
    }
    .job-card .job-meta i { color:var(--color-gold); width:16px; }
    .job-card .job-description {
      color:var(--color-gray-700);
      font-size:0.9rem;
      line-height:1.7;
      margin:0.75rem 0;
      display:-webkit-box;
      -webkit-line-clamp:3;
      -webkit-box-orient:vertical;
      overflow:hidden;
    }
    .job-card .job-tags { display:flex; flex-wrap:wrap; gap:0.4rem; margin:0.5rem 0; }
    .job-card .job-tag {
      padding:0.15rem 0.7rem;
      background:var(--color-gray-soft);
      border-radius:50px;
      font-size:0.7rem;
      color:var(--color-gray-700);
      border:1px solid var(--color-gray-200);
    }
    .job-card .job-actions {
      display:flex;
      gap:0.75rem;
      margin-top:1rem;
      flex-wrap:wrap;
    }
    .job-card .job-actions .btn { flex:1; min-width:100px; }
    .job-card .job-status-badge {
      padding:0.2rem 0.75rem;
      border-radius:50px;
      font-size:0.7rem;
      font-weight:700;
      text-transform:uppercase;
    }
    .job-status-badge.pending { background:rgba(230,57,70,0.1); color:var(--color-emergency); border:1px solid rgba(230,57,70,0.2); }
    .job-status-badge.approved { background:rgba(42,157,143,0.1); color:var(--color-success); border:1px solid rgba(42,157,143,0.2); }
    .job-status-badge.rejected { background:rgba(230,57,70,0.05); color:var(--color-gray-600); border:1px solid var(--color-gray-200); }

    .job-card .job-posted {
      font-size:0.75rem;
      color:var(--color-gray-600);
      margin-top:0.5rem;
    }

    /* ===== EMPTY STATE ===== */
    .empty-state {
      text-align:center;
      padding:4rem 2rem;
      background:var(--color-white);
      border-radius:var(--radius-lg);
      border:1px solid var(--color-gray-200);
    }
    .empty-state i { font-size:4rem; color:var(--color-gray-300); margin-bottom:1rem; }
    .empty-state h3 { font-family:var(--font-serif); color:var(--color-primary); margin-bottom:0.5rem; }
    .empty-state p { color:var(--color-gray-600); max-width:400px; margin:0 auto; }

    /* ===== RESPONSIVE ===== */
    @media (max-width:768px) {
      .job-card .job-header { flex-direction:column; }
      .job-card .job-actions .btn { flex:1 1 100%; }
      .stats-grid { grid-template-columns:1fr 1fr; }
    }
    @media (max-width:480px) {
      .stats-grid { grid-template-columns:1fr; }
      .header-container { flex-direction:column; align-items:flex-start; }
      .header-actions { width:100%; justify-content:space-between; }
    }

    /* ===== TOAST NOTIFICATION ===== */
    .toast {
      position:fixed;
      bottom:2rem;
      right:2rem;
      padding:1rem 1.5rem;
      border-radius:var(--radius-md);
      color:var(--color-white);
      font-weight:600;
      font-size:0.9rem;
      box-shadow:var(--shadow-lg);
      z-index:9999;
      transform:translateY(100px);
      opacity:0;
      transition:all 0.4s ease;
      max-width:400px;
    }
    .toast.show { transform:translateY(0); opacity:1; }
    .toast.success { background:var(--color-success); }
    .toast.error { background:var(--color-emergency); }
    .toast.info { background:var(--color-primary); }
  </style>
</head>
<body>

  <!-- ===== HEADER ===== -->
  <header class="site-header">
    <div class="container">
      <div class="header-container">
        <div class="logo">
          <a href="/" style="text-decoration:none;">
            <span class="brand-name">Hospitality<span class="gold">Recruit</span></span>
            <div class="logo-tagline">Admin Dashboard</div>
          </a>
        </div>
        <div class="header-actions">
          <div class="user-badge"><i class="fas fa-user-shield"></i> <span id="adminName">Admin</span></div>
          <button class="btn btn-outline-gold btn-sm" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> Sign Out</button>
        </div>
      </div>
    </div>
  </header>

  <!-- ===== DASHBOARD ===== -->
  <section style="padding:2rem 0 4rem;">
    <div class="container">

      <h1>Job Approvals</h1>
      <p style="color:var(--color-gray-600);margin-bottom:1.5rem;">Review and approve job postings submitted by employers.</p>

      <!-- ===== STATS ===== -->
      <div class="stats-grid" id="statsGrid">
        <div class="stat-card"><span class="stat-number" id="statTotal">0</span><span class="stat-label">Total Jobs</span></div>
        <div class="stat-card"><span class="stat-number" id="statPending" style="color:var(--color-emergency);">0</span><span class="stat-label">Pending Review</span></div>
        <div class="stat-card"><span class="stat-number" id="statApproved" style="color:var(--color-success);">0</span><span class="stat-label">Approved</span></div>
        <div class="stat-card"><span class="stat-number" id="statRejected" style="color:var(--color-gray-600);">0</span><span class="stat-label">Rejected</span></div>
      </div>

      <!-- ===== TAB FILTERS ===== -->
      <div class="tab-filters">
        <button class="tab-btn active" data-filter="all">All</button>
        <button class="tab-btn" data-filter="pending">Pending <span id="pendingCount" style="background:var(--color-emergency);color:white;padding:0.05rem 0.5rem;border-radius:50px;font-size:0.7rem;margin-left:0.3rem;">0</span></button>
        <button class="tab-btn" data-filter="approved">Approved</button>
        <button class="tab-btn" data-filter="rejected">Rejected</button>
      </div>

      <!-- ===== JOB LIST ===== -->
      <div id="jobListContainer">
        <div class="empty-state" id="emptyState">
          <i class="fas fa-inbox"></i>
          <h3>No jobs to review</h3>
          <p>All job postings have been reviewed. Check back later for new submissions.</p>
        </div>
        <div class="job-list" id="jobList" style="display:none;"></div>
      </div>

    </div>
  </section>

  <!-- ===== TOAST ===== -->
  <div class="toast" id="toast"></div>

  <!-- ===== JAVASCRIPT ===== -->
  <script>
    document.addEventListener('DOMContentLoaded', function() {

      // ============================================================
      // 1. FIREBASE CONFIG (REPLACE WITH YOUR OWN)
      // ============================================================
      const firebaseConfig = {
        apiKey: "YOUR_API_KEY",
        authDomain: "YOUR_PROJECT.firebaseapp.com",
        projectId: "YOUR_PROJECT",
        storageBucket: "YOUR_PROJECT.appspot.com",
        messagingSenderId: "YOUR_SENDER_ID",
        appId: "YOUR_APP_ID"
      };

      let auth = null;
      let db = null;
      let currentUser = null;

      try {
        if (firebaseConfig.apiKey !== "YOUR_API_KEY") {
          firebase.initializeApp(firebaseConfig);
          auth = firebase.auth();
          db = firebase.firestore();
        } else {
          console.warn("Firebase not configured – using demo mode.");
        }
      } catch (e) {
        console.warn("Firebase init error:", e);
      }

      // ============================================================
      // 2. DOM REFS
      // ============================================================
      const jobList = document.getElementById('jobList');
      const emptyState = document.getElementById('emptyState');
      const statTotal = document.getElementById('statTotal');
      const statPending = document.getElementById('statPending');
      const statApproved = document.getElementById('statApproved');
      const statRejected = document.getElementById('statRejected');
      const pendingCount = document.getElementById('pendingCount');
      const adminNameSpan = document.getElementById('adminName');
      const logoutBtn = document.getElementById('logoutBtn');
      const tabBtns = document.querySelectorAll('.tab-btn');
      const toast = document.getElementById('toast');

      let currentFilter = 'all';
      let allJobs = [];
      let toastTimeout = null;

      // ============================================================
      // 3. AUTH STATE
      // ============================================================
      if (auth) {
        auth.onAuthStateChanged(async function(user) {
          if (user) {
            currentUser = user;
            // Check if user has admin claim
            try {
              const token = await user.getIdTokenResult();
              if (!token.claims.admin) {
                // Not an admin – redirect to home
                showToast('Access denied. Admin privileges required.', 'error');
                setTimeout(function() {
                  window.location.href = '/';
                }, 2000);
                return;
              }
              adminNameSpan.textContent = user.displayName || 'Admin';
              loadAllJobs();
            } catch (e) {
              console.error('Error checking admin claim:', e);
              window.location.href = '/';
            }
          } else {
            // Not logged in – redirect to login
            window.location.href = '/employers/login/';
          }
        });
      }

      // ============================================================
      // 4. LOGOUT
      // ============================================================
      if (logoutBtn && auth) {
        logoutBtn.addEventListener('click', function() {
          auth.signOut().then(function() {
            window.location.href = '/employers/login/';
          });
        });
      }

      // ============================================================
      // 5. LOAD ALL JOBS
      // ============================================================
      async function loadAllJobs() {
        if (!db) {
          // Demo mode
          loadDemoJobs();
          return;
        }

        try {
          const snapshot = await db.collection('jobs')
            .orderBy('postedDate', 'desc')
            .get();

          if (snapshot.empty) {
            showEmptyState();
            return;
          }

          allJobs = [];
          snapshot.forEach(function(doc) {
            allJobs.push({ id: doc.id, ...doc.data() });
          });

          renderJobs(currentFilter);
          updateStats();

        } catch (error) {
          console.error('Error loading jobs:', error);
          showToast('Error loading jobs. Please refresh.', 'error');
          // Fallback to demo
          loadDemoJobs();
        }
      }

      // ============================================================
      // 6. DEMO JOBS (Fallback)
      // ============================================================
      function loadDemoJobs() {
        const demoData = [
          { id: 'demo1', jobTitle: 'Executive Chef', companyName: '4T Luxury Hotel', jobLocation: 'Osogbo, Osun', jobType: 'Full-time', jobCategory: 'culinary', jobSalary: '₦8-12M/year', jobTags: ['Fine Dining', 'Leadership'], jobDescription: 'We are seeking a visionary Executive Chef to lead our culinary team at 4T Luxury Hotel.', status: 'pending', postedDate: new Date() },
          { id: 'demo2', jobTitle: 'Hotel Manager', companyName: 'Calmcity Hotel', jobLocation: 'Ilorin, Kwara', jobType: 'Full-time', jobCategory: 'hotel', jobSalary: '₦10-15M/year', jobTags: ['Management', 'Operations'], jobDescription: 'Looking for an experienced Hotel Manager to oversee all hotel operations.', status: 'pending', postedDate: new Date(Date.now() - 86400000) },
          { id: 'demo3', jobTitle: 'F&B Director', companyName: 'Princess Hotel', jobLocation: 'Ilorin, Kwara', jobType: 'Full-time', jobCategory: 'fandb', jobSalary: '₦9-13M/year', jobTags: ['Food & Beverage', 'Leadership'], jobDescription: 'Seeking an experienced F&B Director to lead our food and beverage operations.', status: 'approved', postedDate: new Date(Date.now() - 172800000) },
          { id: 'demo4', jobTitle: 'Pastry Chef', companyName: 'Golden Sands', jobLocation: 'Ilorin, Kwara', jobType: 'Full-time', jobCategory: 'culinary', jobSalary: '₦5-8M/year', jobTags: ['Pastry', 'Baking'], jobDescription: 'Creative Pastry Chef needed to join our culinary team.', status: 'rejected', postedDate: new Date(Date.now() - 259200000) }
        ];

        allJobs = demoData;
        renderJobs(currentFilter);
        updateStats();
        showToast('Using demo data. Connect Firebase for live data.', 'info');
      }

      // ============================================================
      // 7. RENDER JOBS
      // ============================================================
      function renderJobs(filter) {
        const filtered = filter === 'all' ? allJobs : allJobs.filter(function(j) { return j.status === filter; });

        if (filtered.length === 0) {
          showEmptyState();
          return;
        }

        emptyState.style.display = 'none';
        jobList.style.display = 'grid';

        jobList.innerHTML = filtered.map(function(job) {
          const statusClass = job.status || 'pending';
          const statusLabel = statusClass.charAt(0).toUpperCase() + statusClass.slice(1);

          // Format date
          let postedDate = 'Recently';
          if (job.postedDate) {
            if (job.postedDate.toDate) {
              postedDate = job.postedDate.toDate().toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
            } else {
              postedDate = new Date(job.postedDate).toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
            }
          }

          const tags = (job.jobTags || []).map(function(tag) {
            return '<span class="job-tag">' + tag + '</span>';
          }).join('');

          // Action buttons based on status
          let actions = '';
          if (job.status === 'pending') {
            actions = `
              <button class="btn btn-success btn-sm approve-btn" data-id="${job.id}"><i class="fas fa-check"></i> Approve</button>
              <button class="btn btn-danger btn-sm reject-btn" data-id="${job.id}"><i class="fas fa-times"></i> Reject</button>
            `;
          } else {
            actions = `
              <span style="font-size:0.85rem;color:var(--color-gray-600);padding:0.3rem 1rem;background:var(--color-gray-soft);border-radius:50px;">
                <i class="fas ${job.status === 'approved' ? 'fa-check-circle' : 'fa-times-circle'}"></i>
                ${statusLabel}
              </span>
            `;
          }

          return `
            <div class="job-card" data-id="${job.id}">
              <div class="job-header">
                <div>
                  <div class="job-title">${job.jobTitle || 'Untitled'}</div>
                  <div class="job-company"><i class="fas fa-building"></i> ${job.companyName || 'N/A'}</div>
                </div>
                <span class="job-status-badge ${statusClass}">${statusLabel}</span>
              </div>

              <div class="job-meta">
                <span><i class="fas fa-map-marker-alt"></i> ${job.jobLocation || 'N/A'}</span>
                <span><i class="fas fa-briefcase"></i> ${job.jobType || 'N/A'}</span>
                <span><i class="fas fa-credit-card"></i> ${job.jobSalary || 'N/A'}</span>
                <span><i class="fas fa-clock"></i> Posted: ${postedDate}</span>
              </div>

              ${job.jobDescription ? `<div class="job-description">${job.jobDescription}</div>` : ''}

              ${tags ? `<div class="job-tags">${tags}</div>` : ''}

              <div class="job-actions">
                ${actions}
              </div>
              <div class="job-posted"><i class="fas fa-user"></i> Employer: ${job.contactName || 'N/A'} (${job.companyEmail || 'N/A'})</div>
            </div>
          `;
        }).join('');

        // Attach event listeners to approve/reject buttons
        document.querySelectorAll('.approve-btn').forEach(function(btn) {
          btn.addEventListener('click', function() {
            const jobId = this.dataset.id;
            updateJobStatus(jobId, 'approved');
          });
        });

        document.querySelectorAll('.reject-btn').forEach(function(btn) {
          btn.addEventListener('click', function() {
            const jobId = this.dataset.id;
            updateJobStatus(jobId, 'rejected');
          });
        });
      }

      // ============================================================
      // 8. UPDATE JOB STATUS
      // ============================================================
      async function updateJobStatus(jobId, newStatus) {
        // Disable buttons temporarily
        const btns = document.querySelectorAll(`[data-id="${jobId}"]`);
        btns.forEach(function(b) { b.disabled = true; });

        if (!db) {
          // Demo mode – update locally
          const job = allJobs.find(function(j) { return j.id === jobId; });
          if (job) {
            job.status = newStatus;
            renderJobs(currentFilter);
            updateStats();
            showToast('Job ' + newStatus + ' successfully!', 'success');
            btns.forEach(function(b) { b.disabled = false; });
          }
          return;
        }

        try {
          await db.collection('jobs').doc(jobId).update({
            status: newStatus,
            approvedDate: firebase.firestore.FieldValue.serverTimestamp(),
            adminNotes: newStatus === 'approved' ? 'Approved by admin' : 'Rejected by admin'
          });

          // Update local state
          const job = allJobs.find(function(j) { return j.id === jobId; });
          if (job) job.status = newStatus;

          renderJobs(currentFilter);
          updateStats();
          showToast('Job ' + newStatus + ' successfully!', 'success');

        } catch (error) {
          console.error('Error updating job:', error);
          showToast('Error updating job status. Please try again.', 'error');
        }

        btns.forEach(function(b) { b.disabled = false; });
      }

      // ============================================================
      // 9. UPDATE STATS
      // ============================================================
      function updateStats() {
        const total = allJobs.length;
        const pending = allJobs.filter(function(j) { return j.status === 'pending'; }).length;
        const approved = allJobs.filter(function(j) { return j.status === 'approved'; }).length;
        const rejected = allJobs.filter(function(j) { return j.status === 'rejected'; }).length;

        statTotal.textContent = total;
        statPending.textContent = pending;
        statApproved.textContent = approved;
        statRejected.textContent = rejected;
        pendingCount.textContent = pending;
      }

      // ============================================================
      // 10. EMPTY STATE
      // ============================================================
      function showEmptyState() {
        emptyState.style.display = 'block';
        jobList.style.display = 'none';
      }

      // ============================================================
      // 11. TOAST NOTIFICATION
      // ============================================================
      function showToast(message, type) {
        toast.textContent = message;
        toast.className = 'toast ' + type;
        // Force reflow
        void toast.offsetWidth;
        toast.classList.add('show');

        if (toastTimeout) clearTimeout(toastTimeout);
        toastTimeout = setTimeout(function() {
          toast.classList.remove('show');
        }, 4000);
      }

      // ============================================================
      // 12. TAB FILTERS
      // ============================================================
      tabBtns.forEach(function(btn) {
        btn.addEventListener('click', function() {
          tabBtns.forEach(function(b) { b.classList.remove('active'); });
          this.classList.add('active');
          currentFilter = this.dataset.filter;
          renderJobs(currentFilter);
        });
      });

      // ============================================================
      // 13. CURRENT YEAR
      // ============================================================
      // No footer year needed, but keep if used

    });
  </script>

</body>
